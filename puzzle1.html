<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PUZZLE 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<!-- sit in a quiet room, solve puzzle to win -->

<body>
    <div id="fullscreenWarning"
        class="container-fluid d-flex flex-column justify-content-start align-items-center bg-secondary bg-opacity-50 z-3 vh-100 text-center">
        <h1 class="mb-3 mt-5">BLOW YOUR BIRTHDAY CANDLE 🎂</h1>
        <span>
            <button id="start" class="btn btn-warning mx-3">START</button>
            <button id="start2" class="btn btn-warning mx-3" style="display: none;">RE-START</button>
            <a id="next" class="btn btn-primary mx-3" href="puzzle2.html" style="display: none;">NEXT</a>
        </span>
        <button style="display: none" id="startconsoledebug">enable console logs</button>
        <button style="display: none" id="stopconsoledebug">disable console logs</button>
        <br>
        <div id="cake-holder">
            <div class="text-center">
                <h5 class="cake-off">YAY YOU DID IT!</h5>
                <span class="cake-off" id="dancing-face2">(>^o^)></span>
            </div>
            <div class="cake mb-3">
                <div class="plate"></div>
                <div class="layer layer-bottom"></div>
                <div class="layer layer-middle"></div>
                <div class="layer layer-top"></div>
                <div class="icing"></div>
                <div class="drip drip1"></div>
                <div class="drip drip2"></div>
                <div class="drip drip3"></div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="noteModal" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                    </div>
                    <div class="modal-body">
                        ~~ YOU MUST SOLVE THE FOLLOWING PUZZLES TO WIN THE PRIZE. SOLVE THEM CAREFULLY AND MAKE SURE YOU
                        ARE IN A QUIET ROOM ~~

                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="cake.js"></script>
        <script src="volume-meter.js"></script>
        <script src="audioDetectionConfig.js"></script>
        <script src="audioDetection.js"></script>
        <script src="audioStream.js"></script>
        <script src="demo.js"></script>
        <script src="demoAudioRecorder.js"></script>
        <script src="demoAudioDetectionListeners.js"></script>
</body>

</html>
