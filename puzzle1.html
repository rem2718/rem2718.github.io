    <div id="fullscreenWarning"
        class="container-fluid d-flex flex-column justify-content-center align-items-center bg-secondary bg-opacity-50 z-3 vh-100 text-center">

            <button id="start" class="btn btn-warning mb-5 pd-5 mx-3">START</button>
            <button id="start" class="btn btn-warning mb-5 pd-5 mx-3">START</button>
