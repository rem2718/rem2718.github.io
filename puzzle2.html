<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PUZZLE 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="fullscreenWarning"
        class="container-fluid d-flex flex-column justify-content-center align-items-center bg-secondary bg-opacity-50 z-3 vh-100 text-center">
        <h1 class="mb-3">WHAT DO YOU SEE IN THE PICTURE BELOW?</h1>
        <div>IF IT IS HARD TO GUESS YOU CAN INCREASE THE QUALITY <span class="h2 text-danger">GRADUALLY</span></div>
        <div class="container mt-3">
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    - QUALITY -
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="showImage('images/144p.png')">144p</a></li>
                    <li><a class="dropdown-item" href="#" onclick="showImage('images/360p.png')">360p</a></li>
                    <li><a class="dropdown-item" href="#" onclick="showImage('images/720p.png')">720p</a></li>
                    <li><a class="dropdown-item" href="#" onclick="showImage('images/1080p.png')">1080p</a></li>
                </ul>
            </div>
        </div>

        <img id="displayedImage" src="images/144p.png" alt="Selected Quality" class="img-fluid img-thumbnail mt-3"
            style="width: 350px; height: 350px; object-fit: cover;">

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
