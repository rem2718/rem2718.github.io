<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PUZZLE 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="num_style.css">
</head>

<body>
    <div id="fullscreenWarning"
        class="container-fluid d-flex flex-column bg-secondary justify-content-center align-items-center bg-opacity-50 z-3 vh-100 ">
        <h1 class="mb-3 mt-5">THE PASSCODE HOLDS THE PRIZE WILL YOU GUESS IT?</h1>
        <div class="container keypadwrapper bg-secondary p-3 m-5" style="border-radius: 3px">
            <div class=" container mb-2 bg-light p-2 d-flex justify-content-center align-items-center"
                style="border-radius: 10px">
                <span class="numberinput me-4"></span>
                <span class="numberinput"></span>
                <span class="numberinput mx-4"></span>
                <span class="numberinput"></span>
            </div>
            <div class="keypad">
                <div id="lineone" class="numberline">
                    <div class="content btn btn-light p-3">
                        <div class="number">1</div>
                    </div>
                    <div class="content btn btn-light p-3 mx-3">
                        <div class="number">2</div>
                    </div>
                    <div class="content btn btn-light p-3">
                        <div class="number">3</div>
                    </div>
                </div>
                <div id="linetwo" class="numberline">
                    <div class="content btn btn-light p-3 my-3">
                        <div class="number">4</div>
                    </div>
                    <div class="content btn btn-light p-3 mx-3 my-3">
                        <div class="number">5</div>
                    </div>
                    <div class="content btn btn-light p-3 my-3">
                        <div class="number">6</div>
                    </div>
                </div>
                <div id="linethree" class="numberline">
                    <div class="content btn btn-light p-3 mb-3">
                        <div class="number">7</div>
                    </div>
                    <div class="content btn btn-light p-3 mx-3 mb-3">
                        <div class="number">8</div>
                    </div>
                    <div class="content btn btn-light p-3 mb-3">
                        <div class="number">9</div>
                    </div>
                </div>
                <div id="linefour" class="numberline">
                    <div class="content btn btn-light p-3">
                        <div class="number"><</div>
                        </div>
                        <div class="content btn btn-light p-3 mx-3">
                            <div class="number">0</div>
                        </div>
                        <div class="content btn btn-light p-3">
                            <div class="number">></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="feedbackModal" tabindex="-1" aria-labelledby="feedbackModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <div id="modalHeader" class="text-danger h3">WRONG</div>
                        <div id="modalMessage" class="h5"></div>
                    </div>
                    <div class="modal-footer" id="modalFooter"><a id="next" class="btn btn-primary mx-3"
                            href="gift.html" style="display: none;">NEXT</a>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script3.js"></script>
</body>

</html>
